# 复制为 config.yaml 后填写（config.yaml 含密钥，勿提交到公开仓库）

port: 8787
intervalMinutes: 10

# 面板时间所用时区（容器默认 UTC，不设会差 8 小时）
timezone: Asia/Shanghai

# Kindle 横放方向：设备顶部朝哪边
#   left  - 顶部朝左（默认）
#   right - 顶部朝右
#   none  - 不旋转，输出 1024x758（浏览器查看用，Kindle 上会显示异常）
orientation: left

platforms:
  deepseek:
    enabled: true
    # https://platform.deepseek.com/ -> API keys
    apiKey: ""

  chatgpt:
    enabled: true
    # chatgpt.com 登录后，从浏览器 DevTools -> Application -> Cookies 复制完整 Cookie 字符串
    # 过期后图片上会显示告警，重新复制替换即可
    cookie: ""

  workbuddy:
    enabled: true
    # 从 WorkBuddy 登录态中提取 Bearer token（见 README「凭证获取」）
    token: ""
