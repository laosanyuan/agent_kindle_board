# 复制为 config.yaml 后填写（config.yaml 含密钥，勿提交到公开仓库）

port: 8787
intervalMinutes: 10

# 采集失败后沿用上次成功值的最长时间（分钟），超过判定为真正失败
staleMaxMinutes: 180

# 面板时间所用时区（容器默认 UTC，不设会差 8 小时）
timezone: Asia/Shanghai

# Kindle 横放方向：设备顶部朝哪边
#   left  - 顶部朝左（默认）
#   right - 顶部朝右
#   none  - 不旋转，输出 1024x758（浏览器查看用，Kindle 上会显示异常）
orientation: left

# 可选：出网代理（仅 HTTP 代理，例如 v2ray / clash 的 http 入站）
# NAS 直连不到 chatgpt.com 时用它；留空则不使用代理
proxy:
  url: ""            # 例："http://192.168.1.20:10809"（不支持 socks5://）
  applyTo: [chatgpt] # 只对这些平台生效；删掉或留空数组则所有平台都走代理

platforms:
  deepseek:
    enabled: true
    # https://platform.deepseek.com/ -> API keys
    apiKey: ""

  chatgpt:
    enabled: true
    # 运行 `node tools/chatgpt-credential.js --real` 自动提取写入
    cookie: ""

  workbuddy:
    enabled: true
    # Web 版 cookie 认证。提取：`node tools/wb-credential.js`
    #   工具自己维护一个独立副本 profile（%LOCALAPPDATA%\agent-kindle-board\wbprofile），
    #   不占用你自己的 Chrome；首次登录一次即可。
    # userId 不填会自动从 /console/accounts 获取。
    # userAgent 由工具连同 cookie 一起提取 —— 网关按 UA 里的 Chrome 大版本校验，
    #   版本对不上会直接 401（表现为"cookie 已失效"），所以别手改；
    #   Chrome 大版本升级后重跑一次工具即可。
    # 注：服务端 session 固定 7 天失效。日常无需干预：计划任务
    #   agent-kindle-board-wb-refresh 每 10 分钟给 SSO 会话保温、临近到期自动静默续期
    #   （`node tools/wb-credential.js --refresh --push`）。详见 README「凭证获取」。
    cookie: ""
    userId: ""
    userAgent: ""
